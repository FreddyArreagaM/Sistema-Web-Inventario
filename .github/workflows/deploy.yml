name: Deploy Spring Boot Backend to AWS EC2

on:
  push:
    branches:
      - backend  # O la rama que prefieras para hacer deploy

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Clonar el repositorio
      - name: Checkout code
        uses: actions/checkout@v3

      # Paso 2: Configurar Java 17 en el entorno de ejecución
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'

      # Paso 3: Construir el proyecto con Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Paso 4: Subir el archivo JAR a la instancia EC2
      - name: Upload JAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
        run: |
          echo "$EC2_KEY" > ec2-key.pem
          chmod 600 ec2-key.pem
          scp -i ec2-key.pem target/your-app.jar $EC2_USER@$EC2_HOST:/home/ubuntu/

      # Paso 5: Conectarse a EC2 y ejecutar el JAR
      - name: Deploy and run on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
        run: |
          echo "$EC2_KEY" > ec2-key.pem
          chmod 600 ec2-key.pem
          ssh -o StrictHostKeyChecking=no -i ec2-key.pem $EC2_USER@$EC2_HOST "nohup java -jar /home/ubuntu/your-app.jar &"
